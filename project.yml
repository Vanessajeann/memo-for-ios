name: Memo
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '18.0'
packages:
  MemoCore:
    path: MemoCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.3.0'
    MEMO_FFMPEG_ROOT: "$(SRCROOT)/build/ffmpeg-ios"
    CURRENT_PROJECT_VERSION: '1'
targets:
  Memo:
    type: application
    platform: iOS
    sources:
      - App
      - Native
    dependencies:
      - package: MemoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.memo.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: App/Memo-Bridging-Header.h
        GCC_C_LANGUAGE_STANDARD: gnu11
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(MEMO_FFMPEG_ROOT)/include"]
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(MEMO_FFMPEG_ROOT)/lib"]
        OTHER_LDFLAGS: ["$(inherited)", "-lavformat", "-lavcodec", "-lavutil", "-lz", "-liconv", "-framework", "Security", "-framework", "CoreFoundation"]
    scheme:
      gatherCoverageData: true
