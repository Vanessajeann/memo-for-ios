name: iOS development build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select iOS 18 SDK toolchain
        run: |
          test -d /Applications/Xcode_16.4.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Install project generator
        run: brew install xcodegen
      - name: Test, archive and package unsigned development IPA
        run: bash scripts/build-ios.sh
      - name: Upload development package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Memo-iOS-dev-bootstrap-unsigned-${{ github.run_number }}
          path: |
            outputs/*.ipa
            outputs/SHA256SUMS.txt
            outputs/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Memo-iOS-build-logs-${{ github.run_number }}
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 14
